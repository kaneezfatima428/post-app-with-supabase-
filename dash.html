<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connectify | Dashboard Workbench</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3959/3959542.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="dash.css">
</head>

<body class="light-mode">

    <div class="theme-toggle-btn" id="themeToggle">
        <i class="bi bi-moon-fill" id="themeIcon"></i>
    </div>

    <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
                <div class="app-logo-sm"><i class="bi bi-postcard text-white fs-6"></i></div>
                <span>Connectify Board</span>
            </a>
            <div class="mx-auto" style="width: 100%; max-width: 400px;">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white border-end-0 text-muted">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" id="feedSearchInput" class="form-control border-start-0"
                        placeholder="Search title or description...">
                </div>
            </div>
            <div class="dropdown">
                <button class="btn p-0 border-0 d-flex align-items-center justify-content-center rounded-circle bg-dark text-white fw-bold" 
                    type="button" 
                    data-bs-toggle="dropdown" 
                    aria-expanded="false" 
                    style="width: 38px; height: 38px; font-size: 15px; background-color: var(--primary-color) !important;"
                    id="navUserAvatar">
                    <i class="bi bi-person-fill"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm mt-2">
                    <li>
                        <h6 class="dropdown-header text-dark border-bottom pb-2 mb-2" id="navUserEmail">
                            user@example.com
                        </h6>
                    </li>
                    <li><a class="dropdown-item small mb-1" href="#"><i class="bi bi-person me-2 text-primary"></i> My Profile</a></li>
                    <li><a class="dropdown-item small mb-1" href="#"><i class="bi bi-gear me-2 text-secondary"></i> Settings</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <button class="dropdown-item small text-danger" id="logoutBtn">
                            <i class="bi bi-box-arrow-right me-2"></i> Exit Workbench
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid my-4 px-md-4">
        <div class="row g-4">

            <div class="col-12 col-md-5 col-lg-4">
                <div class="card p-4 shadow-sm border-0 sticky-sidebar post-creator-card">
                    <h5 class="fw-bold mb-3 text-gradient" id="formHeaderTitle">Create a Post</h5>
                    <form id="postForm">
                        <input type="hidden" id="editPostId" value="">

                        <div class="mb-3">
                            <input type="text" id="postTitle" class="form-control p-2.5 fw-semibold"
                                placeholder="Title of the post..." required>
                        </div>

                        <div class="mb-3">
                            <textarea id="postDescription" class="form-control p-3" rows="5"
                                placeholder="Write post content here..." required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="background-image" class="form-label small text-muted mb-1 fw-semibold">Upload Background Image (Optional)</label>
                            <input class="form-control form-control-sm" type="file" id="background-image" accept="image/*">
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small text-muted mb-1 fw-semibold">Text Color</label>
                                <input type="color" id="textColor" class="form-control form-control-color w-100"
                                    value="#ffffff">
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-muted mb-1 fw-semibold">Canvas Mode</label>
                                <select id="canvasMode" class="form-select form-select-sm">
                                    <option value="solid">Solid Colors</option>
                                    <option value="gallery">Background Gallery</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3" id="bgControlPanel">
                            <label class="form-label small text-muted mb-1 fw-semibold">Select Solid Color</label>
                            <input type="color" id="solidColorField" class="form-control form-control-color w-100"
                                value="#6C8196">
                        </div>

                        <button type="submit" id="submitPostBtn" class="btn btn-primary w-100 fw-bold shadow-sm py-2">
                            <i class="bi bi-plus-circle me-1"></i> Post Now
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-12 col-md-7 col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-3 px-1">
                    <h6 class="fw-bold text-uppercase text-muted tracking-wider m-0" id="feedHeadingLabel">Live Global Feed Matrix</h6>
                    <span class="badge bg-secondary rounded-pill" id="postCount">0 units rendered</span>
                </div>

                <div id="postsFeed" class="d-flex flex-column gap-3"></div>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dash.js"></script>
</body>

</html>
